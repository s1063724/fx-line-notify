name: debug-bot-csv
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -A "$UA" -X POST -H "Content-Type: application/json" -d '{}' https://www.esunbank.com/api/client/ExchangeRate/LastRateInfo -o e.json
          python3 -c "
          import json,datetime;d=json.load(open('e.json'))
          print({k:v for k,v in d.items() if k!='Rates'})
          for r in d['Rates']:
            if 'USD' in r['CCY']: print(r)
          "
          curl -sS -o /dev/null -w "esun-no-UA %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{}' https://www.esunbank.com/api/client/ExchangeRate/LastRateInfo
