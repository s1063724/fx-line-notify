name: debug-src
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          curl -sS -A "$UA" https://www.findrate.tw/USD/ -o f.html
          python3 - <<'PY'
          import re
          s=open('f.html',encoding='utf-8',errors='replace').read()
          for m in re.finditer(r'<tr[^>]*>(.*?)</tr>',s,re.S):
              t=re.sub(r'<[^>]+>','|',m.group(1)); t=re.sub(r'\s+',' ',t); t=re.sub(r'(\| ?)+','|',t)
              if any(k in t for k in ['臺灣銀行','玉山','銀行名稱','更新','現鈔']): print(t[:220])
          i=s.find('更新'); print('UPD',re.sub(r'<[^>]+>',' ',s[i-200:i+200]))
          i=s.find('臺灣銀行</a></td>'); print('RAW',s[i-300:i+600])
          PY
